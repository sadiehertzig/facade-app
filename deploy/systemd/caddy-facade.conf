# Drop-in for the packaged caddy.service, installed by deploy/bootstrap.sh as
# /etc/systemd/system/caddy.service.d/facade.conf. Supplies FACADE_HOST (from
# SSM /facade/prod/host) for the Caddyfile's {$FACADE_HOST} site address; the
# file is also read by ExecReload, so `systemctl reload caddy` sees it too.
[Service]
EnvironmentFile=/etc/facade/host.env
LimitCORE=0
